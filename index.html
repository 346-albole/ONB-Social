<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/src/assets/onbsocial-logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONBSocial</title>
    <style>
      body, html { margin: 0; padding: 0; background: #EEE9FF; height: 100vh; font-family: sans-serif; }
      #app-loader { height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
      .brand-loader { display: flex; align-items: center; gap: 10px; opacity: 0.8; animation: pulse 1.5s infinite alternate; }
      .brand-loader img { width: 44px; height: 44px; border-radius: 10px; }
      .brand-loader span { font-size: 1.5rem; font-weight: 800; color: #4C10E0; }
      .loader-spinner { width: 36px; height: 36px; border: 3px solid #e2d9ff; border-top-color: #4C10E0; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loader">
        <div class="brand-loader">
          <img src="/src/assets/onbsocial-logo.svg" alt="ONBSocial" />
          <span>ONBSocial</span>
        </div>
        <div class="loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
